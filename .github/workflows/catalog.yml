name: Check shared catalog consistency
on:
  push:
    paths: ['shared/**', 'android-legacy/assets/**', 'android/resources/app/src/main/assets/aobing/**', 'scripts/check-catalog.mjs', '.github/workflows/catalog.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-catalog.mjs
