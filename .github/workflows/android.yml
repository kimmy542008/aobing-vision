name: Build Android 9 compatibility packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/build-android.py', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: python scripts/build-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android9-packages-and-source
          path: installer/android/*
          if-no-files-found: error
  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android9-packages-and-source
          path: release-assets
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const names=fs.readdirSync('release-assets');
            if(names.filter(n=>n.endsWith('.apk')).length!==4) throw new Error('Expected TV and mobile APKs');
            fs.writeFileSync('release-assets/SHA256SUMS.txt',names.map(n=>crypto.createHash('sha256').update(fs.readFileSync('release-assets/'+n)).digest('hex')+'  '+n).join('\n')+'\n');
            const tag='android-v0.4.16';
            const body='Android TV / 华为可安装APK的电视 / 手机平板同步更新0.4.16。最低API21，目标API28，v1/v2签名。\n\n华为电视请选择ARM32；其它电视按架构选择；手机平板选择Mobile-Universal。志高A10实际API19请使用独立兼容版。\n\n同步清理后的频道快照与台标、所有版本标识。红果Windows客户端入口未移植安卓，云账号尚未上线。不是原生鸿蒙HAP。\n\n未经全部设备实测。签名可能不同，覆盖安装冲突时先备份配置。GPL源码和校验信息随附。开发者Rios敖丙。';
            let release;
            try{release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data}catch(e){if(e.status!==404)throw e;release=(await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:context.sha,name:'敖丙视界 Android 9.0 兼容测试版 0.4.16',body,prerelease:true})).data}
            for(const name of [...names,'SHA256SUMS.txt']){if(release.assets.some(a=>a.name===name))throw new Error('Preserve existing asset: '+name);await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data:fs.readFileSync('release-assets/'+name)})}
